[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cashfc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2.3",
  "scipy>=1.14.1",
  "statsmodels>=0.14.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.18",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["engine*", "app*"]

[tool.pytest.ini_options]
markers = ["perf: timing tests, run manually", "slow: golden model tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
